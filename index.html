<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0d10">
<meta name="description" content="Emmavengers Studio — a simple, powerful video editor that works in your browser, even offline.">
<title>Emmavengers Studio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/studio.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="menuBtn" class="ib" aria-label="My projects"></button>
    <div class="brand">Emmavengers <b>Studio</b></div>
    <button id="ratioBtn" class="chip" aria-label="Video shape">9:16</button>
    <button id="exportBtn" class="primary" disabled>Export</button>
  </header>
  <section id="stage">
    <canvas id="preview" width="360" height="640"></canvas>
    <div id="cmp" hidden><div class="cmpline"><i></i></div><span class="ctag l">Before</span><span class="ctag r">After</span></div>
    <span id="cmpTag" hidden>Before</span>
    <div id="recCount" hidden>3</div>
    <button id="fsBtn" class="cmpbtn fsbtn" aria-label="Full screen preview"></button>
    <button id="cmpBtn" class="cmpbtn" aria-label="Compare before and after (tap: split view, hold: before)"></button>
    <div id="empty"><button id="emptyAdd" class="btn primary big">＋ Add videos &amp; photos</button><p>Make your Emmavengers video. Everything stays on this phone and works offline.</p></div>
  </section>
  <div id="transport">
    <div class="time"><span id="tcur">00:00.0</span> <span class="sep">/</span> <span id="ttot">00:00.0</span></div>
    <div class="pgrp"><button id="toStart" class="ib sm" aria-label="Go to start"></button><button id="playBtn" class="play" aria-label="Play"></button><button id="toEnd" class="ib sm" aria-label="Go to end"></button></div>
    <div class="hist"><span id="kfBar" hidden><button id="kfPrev" class="ib kb" aria-label="Previous keyframe"></button><button id="kfBtn" class="ib kb" aria-label="Add keyframe"></button><button id="kfNext" class="ib kb" aria-label="Next keyframe"></button></span><button id="undoBtn" class="ib" aria-label="Undo"></button><button id="redoBtn" class="ib" aria-label="Redo"></button></div>
  </div>
  <nav id="toolbar"></nav>
  <section id="timeline">
    <canvas id="ruler"></canvas>
    <div id="tlScroll"><div id="tlContent"><div id="tracks"></div></div></div>
    <div id="playhead"></div>
    <div id="tlTip" hidden></div>
    <div id="zoom"><button id="zoomOut" class="ib" aria-label="Zoom out"></button><button id="zoomIn" class="ib" aria-label="Zoom in"></button></div>
    <button id="addMainBtn" aria-label="Add video or photo"></button>
  </section>
</div>
<div id="sheet" class="sheet hidden"></div>
<div id="home" hidden></div>
<div id="exportView" hidden></div>
<div id="busy" hidden><div class="spin"></div><p id="busyText">Adding…</p></div>
<div id="toast" role="status"></div>
<input type="file" id="fileMedia" accept="video/*,image/*" multiple hidden>
<input type="file" id="fileAudio" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" multiple hidden>
<script src="js/vendor/mp4box.all.min.js"></script>
<script src="js/vendor/mp4-muxer.js"></script>
<script type="module" src="js/app.js"></script>
<script>/* offline + automatic updates (service worker generated by tools/build_sw.py) */
if ('serviceWorker' in navigator) addEventListener('load', () => {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const ask = w => w && w.postMessage('build');
    navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.build && !window.STUDIO_BUILD) window.STUDIO_BUILD = e.data.build; });
    if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('build');
    // A new version finished downloading last time: switch to it now, as the app opens (nothing is lost: projects live in IndexedDB).
    if (reg.waiting && navigator.serviceWorker.controller) { let done = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!done) { done = true; location.reload(); } }); reg.waiting.postMessage('skipWaiting'); }
    // A new version finished downloading while the app is open: offer a tap-to-update button.
    const offer = w => { if (!w || !navigator.serviceWorker.controller || document.getElementById('updBtn')) return;
      const b = document.createElement('button'); b.id = 'updBtn'; b.textContent = '✨ New update ready! Tap to update';
      b.onclick = async () => { b.textContent = 'Updating…'; try { await window.studio?.save(); } catch (e) {} let d = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!d) { d = true; location.reload(); } }); w.postMessage('skipWaiting'); setTimeout(() => location.reload(), 4000); };
      document.body.appendChild(b); };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); }); });
    addEventListener('online', () => reg.update().catch(() => {}));
    document.addEventListener('visibilitychange', () => { if (!document.hidden && navigator.onLine) reg.update().catch(() => {}); });
    setInterval(() => navigator.onLine && reg.update().catch(() => {}), 30 * 60 * 1000);
  }).catch(() => {});
});
</script>
</body>
</html>
